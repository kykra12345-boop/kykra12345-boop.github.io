<div>
  <script src="https://cdn.jsdelivr.net/npm/@vkid/sdk@2.6.8/dist-sdk/umd/index.js"></script>

  <script type="text/javascript">
    if ('VKIDSDK' in window) {
      const VKID = window.VKIDSDK;

      VKID.Config.init({
        app: 54769424,
        redirectUrl: 'https://kykra12345-boop.github.io/',
        responseMode: VKID.ConfigResponseMode.Callback,
        source: VKID.ConfigSource.LOWCODE,
        scope: 'wall groups',
      });

      const oneTap = new VKID.OneTap();

      oneTap.render({
        container: document.currentScript.parentElement,
        showAlternativeLogin: true
      })
      .on(VKID.WidgetEvents.ERROR, vkidOnError)
      .on(VKID.OneTapInternalEvents.LOGIN_SUCCESS, function (payload) {
        const code = payload.code;
        const deviceId = payload.device_id;

        console.log('CODE:', code);
        console.log('DEVICE ID:', deviceId);

        VKID.Auth.exchangeCode(code, deviceId)
          .then(vkidOnSuccess)
          .catch(vkidOnError);
      });

      function vkidOnSuccess(data) {
        console.log('VK AUTH RESULT:', data);

        document.body.innerHTML =
          '<h2>Авторизация прошла</h2>' +
          '<p>Данные получены. Токен не показываем на странице.</p>';

        console.log('ACCESS TOKEN:', data.access_token);
        console.log('REFRESH TOKEN:', data.refresh_token);
        console.log('USER ID:', data.user_id);
      }

      function vkidOnError(error) {
        console.error('VK AUTH ERROR:', error);

        document.body.innerHTML =
          '<h2>Ошибка авторизации</h2>' +
          '<pre>' + JSON.stringify(error, null, 2) + '</pre>';
      }
    }
  </script>
</div>
